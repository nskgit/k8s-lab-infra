# Dependabot — supply-chain watcher (adopted 2026-07-14, wired 2026-07-16).
# Opens PRs when action pins or Terraform providers have updates/CVEs;
# those PRs flow through infra-ci like any human change.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:                  # one weekly PR for all action bumps, not five
        patterns: ["*"]

  - package-ecosystem: terraform
    directories:
      - /terraform/bootstrap
      - /terraform/primary
      - /terraform/modules/network
      - /terraform/modules/cluster-node
      - /terraform/modules/lb
      - /terraform/modules/iam-ccm
    schedule:
      interval: weekly
    groups:
      oci-provider:             # shared provider = ONE PR across all dirs
        patterns: ["oracle/*"]  # (a per-dir bump can never pass init alone)
    ignore:
      - dependency-name: oracle/oci
        update-types: ["version-update:semver-major"]
        versions: [">= 7"]      # belt-and-braces: PR #15 slipped through
                                # update-types alone (config-change race)
        # 6.x -> 8.x is a MIGRATION (breaking-change review + plan diff),
        # scheduled deliberately — not recurring PR noise. Tracked in plan.
