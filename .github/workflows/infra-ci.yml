# ============================================================================
# Pipeline 1, stage 1 — static checks + plan-on-PR for the infra repo
# (Block 11, B11-1/B11-2). The merge-triggered apply/configure/bootstrap
# CD lives in infra-cd.yml — this file never touches live infrastructure
# beyond a read-only `terraform plan`. That plan is handed to CD as an
# encrypted artifact and applied verbatim after merge: what the reviewer
# approved is what runs.
#
# Runner: ubuntu-latest (x86) — nothing here builds an architecture-
# specific artifact; plans are arch-agnostic.
# ============================================================================
name: infra CI

permissions:
  contents: read
  pull-requests: write   # terraform-plan posts/updates a PR comment

on:
  pull_request:
    paths:
      - "terraform/**"
      - "ansible/**"
      - "policy/**"
      - ".github/workflows/*.yml"
  # On push to main only the two scanners run (see the per-job `if`s):
  # branch protection requires an up-to-date branch, so the merged tree is
  # byte-identical to the PR head every static check already passed on —
  # re-running them is pure duplication. gitleaks stays (its history scan
  # covers Dependabot merges, whose PR run skips it) and Trivy/Checkov stay
  # (their SARIF upload is what populates the Security tab for main).
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "ansible/**"
      - "policy/**"
      - ".github/workflows/*.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TERRAFORM_VERSION: "1.15.7"     # matches the operator machine
  CONFTEST_VERSION: "0.56.0"

jobs:

  terraform-checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Format check (fails on any unformatted file)
        run: terraform fmt -check -recursive -diff terraform/

      - name: Validate every root (no backend, no credentials)
        run: |
          for root in terraform/bootstrap terraform/primary; do
            echo "=== $root"
            terraform -chdir="$root" init -backend=false -input=false >/dev/null
            terraform -chdir="$root" validate
          done

      - uses: terraform-linters/setup-tflint@v6

      - name: Lint (tflint, all directories)
        working-directory: terraform
        run: |
          tflint --recursive

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write   # SARIF upload to the Security tab
    steps:
      - uses: actions/checkout@v7

      - name: IaC misconfig scan (Trivy — tfsec's successor engine; gates the build)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          exit-code: "1"
          severity: HIGH,CRITICAL

      - name: IaC misconfig scan, SARIF (Trivy — for the Security tab, doesn't re-gate)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          format: sarif
          output: trivy.sarif
          exit-code: "0"

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy-iac

      # Checkov: complementary to Trivy — deeper Terraform-specific coverage
      # (1000+ policies, cross-resource graph analysis) per 2026 tooling
      # research. Monitor-only for now (exit-code 0): a brand-new scanner's
      # first run on an established repo routinely surfaces a pile of
      # findings that need triage, not an instant hard-fail — promote to
      # gating once the initial findings are reviewed and either fixed or
      # explicitly suppressed with a reason.
      - name: IaC misconfig scan (Checkov — monitor-only until findings are triaged)
        if: always()
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          output_format: sarif
          output_file_path: checkov.sarif
          soft_fail: true

      - name: Upload Checkov SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: checkov.sarif
          category: checkov

  secret-scan:
    # Dependabot-triggered runs get a restricted GITHUB_TOKEN (GitHub's
    # defense against malicious dependency PRs) -> gitleaks' PR-commit API
    # call 403s. Dependabot only changes pins; every merge is still
    # scanned by the push run, so skipping costs zero coverage.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # gitleaks scans history, not just the tip
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  workflow-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Lint the workflows themselves (actionlint)
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  ansible-checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pinned ansible toolchain
        # yamllint intentionally unpinned here: ansible-lint==26.6.0 already
        # requires yamllint>=1.38.0 as its own dependency, so pinning a
        # separate (older) version here breaks pip's resolver.
        run: pip install ansible-core==2.21.2 ansible-lint==26.6.0

      - name: Install collection dependencies
        run: ansible-galaxy collection install -r requirements.yml

      - name: yamllint (raw YAML syntax/style — duplicate keys, trailing whitespace)
        run: yamllint -c ../.yamllint.yml .

      - name: Lint (production profile, .ansible-lint config)
        run: ansible-lint

      - name: Playbook syntax check
        run: ansible-playbook -i inventory/hosts.ini site.yml --syntax-check

  pip-audit:
    # Vulnerability check on the pinned ansible toolchain — mirrors what
    # k8s-lab-apps already does for its Python deps; this repo never had it.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Audit pinned ansible-core/ansible-lint
        run: |
          pip install pip-audit
          pip-audit --requirement <(echo "ansible-core==2.21.2"; echo "ansible-lint==26.6.0")

  shellcheck:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck all tracked shell scripts
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: '.'
          severity: warning

  terraform-plan:
    # PR-only: real OCI credentials + backend, read-only `terraform plan`.
    # Posts the diff as a PR comment, plus a separate, prominent block for
    # anything policy/risky-attrs.rego flags (LEARNING-LOG §15 — a clean
    # "0 destroy" plan is not sufficient proof of safety). This job never
    # applies anything — but the plan it produces IS what infra-cd.yml
    # applies after merge (uploaded below, encrypted), so the reviewer
    # approves the exact change that lands, not a re-plan of it.
    #
    # Skipped for Dependabot: its PRs get no repo secrets, so the OCI init
    # can't work. A skipped required check still satisfies branch
    # protection, and CD falls back to re-plan-at-merge (hard policy gate)
    # when no artifact exists for the merged PR.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure OCI CLI credentials
        run: |
          mkdir -p ~/.oci
          printf '%s' "${{ secrets.OCI_CONFIG_FILE_CONTENT }}" > ~/.oci/config
          printf '%s' "${{ secrets.OCI_PRIVATE_KEY_PEM }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/config ~/.oci/oci_api_key.pem

      - name: Write backend.hcl (native oci backend — bucket/namespace aren't secret; auth reuses ~/.oci/config above)
        run: |
          cat > terraform/primary/backend.hcl <<'EOF'
          bucket    = "k8s-lab-tfstate"
          namespace = "idqz7bbbe34a"
          key       = "primary/terraform.tfstate"
          region    = "us-ashburn-1"
          auth      = "APIKey"
          config_file_profile = "DEFAULT"
          EOF

      - name: Install conftest
        run: |
          curl -sSL -o conftest.tar.gz \
            "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          tar -xzf conftest.tar.gz conftest
          sudo mv conftest /usr/local/bin/

      - name: terraform plan (primary — the only root that changes routinely)
        id: plan
        working-directory: terraform/primary
        env:
          # Day-1 sourcing for the edge module's gateway cert: the same
          # wildcard material Istio already uses (TLS_WILDCARD_CERT_PEM/
          # KEY_PEM), not a new secret. See terraform/modules/edge's
          # comments for the planned Let's-Encrypt follow-up.
          TF_VAR_edge_certificate_pem: ${{ secrets.TLS_WILDCARD_CERT_PEM }}
          TF_VAR_edge_certificate_key_pem: ${{ secrets.TLS_WILDCARD_KEY_PEM }}
        run: |
          set -o pipefail   # otherwise `tee` masks a failed plan
          terraform init -backend-config=backend.hcl -input=false
          terraform plan -no-color -out=tfplan -input=false | tee plan.txt
          terraform show -json tfplan > plan.json

      # The binary plan carries every planned value unredacted (plan.json
      # masks `sensitive` values; tfplan does not), and artifacts are
      # downloadable by anyone who can read the repo — so it never leaves
      # the runner in the clear. The symmetric key exists only in Actions
      # secrets; infra-cd.yml decrypts with the same one.
      - name: Encrypt the plan for hand-off to CD
        working-directory: terraform/primary
        env:
          TFPLAN_PASSPHRASE: ${{ secrets.TFPLAN_PASSPHRASE }}
        run: |
          test -n "${TFPLAN_PASSPHRASE}" || { echo "::error::TFPLAN_PASSPHRASE secret is not set"; exit 1; }
          tar -czf tfplan.tar.gz tfplan plan.json
          gpg --batch --yes --symmetric --cipher-algo AES256 \
            --pinentry-mode loopback --passphrase-fd 0 \
            -o tfplan.tar.gz.gpg tfplan.tar.gz <<<"${TFPLAN_PASSPHRASE}"
          rm -f tfplan.tar.gz

      - name: Upload the reviewed plan for CD to apply verbatim
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-${{ github.event.pull_request.head.sha }}
          path: terraform/primary/tfplan.tar.gz.gpg
          retention-days: 30
          if-no-files-found: error

      - name: Policy check (risky non-ForceNew attributes)
        id: policy
        working-directory: terraform/primary
        run: |
          conftest test --output json -p ../../policy plan.json > conftest.json || true
          WARN_COUNT=$(jq '[.[].warnings[]?] | length' conftest.json)
          echo "warn_count=${WARN_COUNT}" >> "$GITHUB_OUTPUT"
          if [ "${WARN_COUNT}" -gt 0 ]; then
            {
              echo "### :rotating_light: Risky-attribute findings (LEARNING-LOG §15)"
              echo
              jq -r '[.[].warnings[]?] | .[]' conftest.json | sed 's/^/- /'
            } > risky-findings.md
          else
            echo "No risky-attribute findings." > risky-findings.md
          fi

      - name: Post/update PR comment
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/primary/plan.txt', 'utf8').slice(0, 60000);
            const risky = fs.readFileSync('terraform/primary/risky-findings.md', 'utf8');
            const marker = '<!-- infra-ci: terraform-plan -->';
            const body = `${marker}\n${risky}\n\n<details><summary>terraform plan (primary)</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }
