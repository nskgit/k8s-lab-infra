# ============================================================================
# Pipeline 1, stage 2 — merge-triggered CD (Block 11, B11-3/B11-4/B11-5).
#
# Two gates, deliberately separate (2026-09-09):
#   1. merge  — branch protection on main: required checks + PR. The
#      review is the change approval.
#   2. deploy — the `approve` job targets the `production` environment,
#      whose required reviewer must approve in the Actions UI before
#      anything mutates. Merge = "code accepted"; approval = "deploy now".
#
# What gets applied is the plan the reviewer saw: infra-ci.yml uploads the
# PR-time plan (encrypted) and terraform-apply downloads and applies that
# exact file. Terraform refuses a saved plan whose state has moved ("Saved
# plan is stale"), so review-to-merge drift fails closed. Only when no
# reviewed plan exists for the merged commit (Dependabot PR, expired
# artifact, force_replan dispatch) does it re-plan — and then the
# risky-attribute policy check is a hard fail, not the PR-time warn.
#
# Backend auth: native `oci` backend (Terraform >= 1.12, migrated
# 2026-09-08 from the S3-compatible shim) — reuses the exact same
# ~/.oci/config profile as the provider. No AWS-shaped credentials
# anywhere in this file.
#
# Stages: changes -> approve -> terraform-apply -> ansible-configure ->
# argo-bootstrap (inside the ansible run, see site.yml) -> smoke-test ->
# rollback-on-failure.
# ============================================================================
name: infra CD

permissions:
  contents: write   # rollback job opens a revert PR

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "ansible/**"
      - "policy/**"
      - ".github/workflows/infra-cd.yml"
  workflow_dispatch:
    inputs:
      force_replan:
        description: "Ignore the PR-time plan and re-plan at apply time (use after a 'Saved plan is stale' failure)"
        type: boolean
        default: false

concurrency:
  # Renamed 2026-09-10: the prior group name (infra-cd-main) got stuck —
  # multiple back-to-back cancelled/superseded runs that night (a
  # workflow-only push, then a same-day PR merge) left every subsequent
  # run permanently queued with zero jobs ever starting, even after a
  # fresh workflow_dispatch and a disable/re-enable cycle. A known,
  # rare GitHub Actions concurrency-group failure mode; renaming the
  # group is the standard, documented recovery (there's no API to reset
  # a group's internal queue state directly).
  group: infra-cd-main-v2
  cancel-in-progress: false   # never cancel a live apply mid-flight

env:
  TERRAFORM_VERSION: "1.15.7"
  CONFTEST_VERSION: "0.56.0"

jobs:

  changes:
    # github.event.head_commit.modified/added only reflects ONE commit —
    # unreliable for a merge-commit push (proven: PR #15's merge skipped
    # terraform-apply entirely despite terraform/ files changing, because
    # the merge commit's own head_commit metadata didn't list them). This
    # diffs the full push range instead.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # A manual dispatch has no push range to diff — treat it as "everything".
      terraform: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.terraform == 'true' }}
      ansible: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.ansible == 'true' }}
      workflows: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.workflows == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        if: github.event_name == 'push'
        id: filter
        with:
          base: ${{ github.event.before }}
          filters: |
            terraform:
              - 'terraform/**'
            ansible:
              - 'ansible/**'
            workflows:
              - '.github/workflows/infra-cd.yml'

  approve:
    # The deploy gate. `production` carries a required reviewer (repo
    # setting — see README.md); this job pauses the run until they approve
    # in the Actions UI. One no-op job holds the environment so a run asks
    # for ONE approval, and every mutating job below `needs` it.
    needs: changes
    if: needs.changes.outputs.terraform == 'true' || needs.changes.outputs.ansible == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - run: echo "Approved for production by the environment's required reviewer."

  terraform-apply:
    needs: [changes, approve]
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read        # download the PR-time plan artifact from the CI run
      pull-requests: read  # merged commit -> PR lookup
    outputs:
      applied: ${{ steps.apply.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # tree-hash comparison against the PR head

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure OCI CLI credentials
        run: |
          mkdir -p ~/.oci
          printf '%s' "${{ secrets.OCI_CONFIG_FILE_CONTENT }}" > ~/.oci/config
          printf '%s' "${{ secrets.OCI_PRIVATE_KEY_PEM }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/config ~/.oci/oci_api_key.pem

      - name: Write backend.hcl (native oci backend — auth reuses ~/.oci/config above)
        run: |
          cat > terraform/primary/backend.hcl <<'EOF'
          bucket    = "k8s-lab-tfstate"
          namespace = "idqz7bbbe34a"
          key       = "primary/terraform.tfstate"
          region    = "us-ashburn-1"
          auth      = "APIKey"
          config_file_profile = "DEFAULT"
          EOF

      - name: Install conftest
        run: |
          curl -sSL -o conftest.tar.gz \
            "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          tar -xzf conftest.tar.gz conftest
          sudo mv conftest /usr/local/bin/

      - name: Locate the reviewed plan (the PR-time artifact for this merge)
        id: locate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          replan() { echo "::warning::$1 — falling back to re-plan (hard policy gate)."; echo "mode=replan" >> "$GITHUB_OUTPUT"; exit 0; }

          [ "${{ inputs.force_replan }}" = "true" ] && replan "force_replan requested"

          # Squash-merge commit -> the PR it came from -> that PR's head SHA.
          PR_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main")][0] // empty')
          [ -n "${PR_JSON}" ] || replan "no merged PR is associated with ${GITHUB_SHA} (direct push?)"
          PR_NUM=$(jq -r .number <<<"${PR_JSON}")
          HEAD_SHA=$(jq -r .head.sha <<<"${PR_JSON}")
          HEAD_REPO=$(jq -r .head.repo.full_name <<<"${PR_JSON}")
          echo "Merged from PR #${PR_NUM}, head ${HEAD_SHA} (${HEAD_REPO})"
          [ "${HEAD_REPO}" = "${GITHUB_REPOSITORY}" ] || replan "PR head is from a fork; its plan job ran without secrets"

          # A plan is only valid for the tree it was computed from. Branch
          # protection's "require up to date" makes the squash commit's tree
          # equal the PR head's tree — verify instead of assuming.
          git fetch -q origin "refs/pull/${PR_NUM}/head"
          [ "$(git rev-parse "${GITHUB_SHA}^{tree}")" = "$(git rev-parse "${HEAD_SHA}^{tree}")" ] \
            || replan "merged tree differs from PR head tree — the reviewed plan does not describe this commit"

          RUN_ID=$(gh run list --workflow "infra CI" --event pull_request --commit "${HEAD_SHA}" \
            --status success --json databaseId --jq '.[0].databaseId // empty')
          [ -n "${RUN_ID}" ] || replan "no successful PR-time CI run found for ${HEAD_SHA}"
          gh run download "${RUN_ID}" -n "tfplan-${HEAD_SHA}" -D terraform/primary \
            || replan "artifact tfplan-${HEAD_SHA} not on run ${RUN_ID} (expired, or the plan job was skipped — e.g. Dependabot)"

          echo "Reusing the plan reviewed on PR #${PR_NUM} (CI run ${RUN_ID})."
          echo "mode=reuse" >> "$GITHUB_OUTPUT"

      - name: Decrypt + load the reviewed plan
        if: steps.locate.outputs.mode == 'reuse'
        working-directory: terraform/primary
        env:
          TFPLAN_PASSPHRASE: ${{ secrets.TFPLAN_PASSPHRASE }}
        run: |
          gpg --batch --yes --decrypt --pinentry-mode loopback --passphrase-fd 0 \
            -o tfplan.tar.gz tfplan.tar.gz.gpg <<<"${TFPLAN_PASSPHRASE}"
          tar -xzf tfplan.tar.gz tfplan plan.json
          rm -f tfplan.tar.gz tfplan.tar.gz.gpg
          terraform init -backend-config=backend.hcl -input=false
          terraform show -no-color tfplan | tail -n 3

      - name: terraform plan (fallback — no reusable reviewed plan, see step above)
        if: steps.locate.outputs.mode == 'replan'
        working-directory: terraform/primary
        env:
          # Day-1 sourcing for the edge module's gateway cert — see the
          # matching step in infra-ci.yml.
          TF_VAR_edge_certificate_pem: ${{ secrets.TLS_WILDCARD_CERT_PEM }}
          TF_VAR_edge_certificate_key_pem: ${{ secrets.TLS_WILDCARD_KEY_PEM }}
        run: |
          terraform init -backend-config=backend.hcl -input=false
          terraform plan -no-color -out=tfplan -input=false
          terraform show -json tfplan > plan.json

      - name: Policy gate — HARD FAIL here, unlike the PR-time warn
        working-directory: terraform/primary
        run: |
          conftest test --output json -p ../../policy plan.json > conftest.json || true
          WARN_COUNT=$(jq '[.[].warnings[]?] | length' conftest.json)
          if [ "${WARN_COUNT}" -gt 0 ]; then
            echo "::error::${WARN_COUNT} risky-attribute finding(s) at merge time — something changed between PR review and merge that nobody actually reviewed. Refusing to apply."
            jq -r '[.[].warnings[]?] | .[]' conftest.json
            exit 1
          fi

      # Same Trivy gate infra-ci.yml runs at PR time, re-run here as a final
      # check immediately before the destructive step — consistent with
      # re-running the policy gate above rather than trusting the PR-time
      # result still holds.
      - name: IaC misconfig scan (Trivy) — final gate before apply
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          exit-code: "1"
          severity: HIGH,CRITICAL

      # A reused plan is checked against live state here: Terraform errors
      # with "Saved plan is stale" if the state serial moved since review
      # (a manual apply, a previous CD run). Recovery: look at what moved,
      # then a manual dispatch with force_replan=true.
      - name: terraform apply (the reviewed plan, or the gated re-plan)
        id: apply
        working-directory: terraform/primary
        run: terraform apply -auto-approve -input=false tfplan

      - name: Sync DNS if the bastion/LB public IP changed
        working-directory: terraform/primary
        run: |
          LB_IP=$(terraform output -raw lb_public_ip)
          echo "Current LB public IP: ${LB_IP}"
          # Compares against the public DNS zone's current A record and
          # updates it via `oci dns record rrset update` only on a mismatch.
          # NOTE: first real run needs the exact zone/domain name confirmed
          # against the live OCI DNS zone before this is load-bearing —
          # flagged in the plan doc's verification section, not yet proven.
          CURRENT_DNS_IP=$(dig +short satheshkumarnapoleon.site @8.8.8.8 | tail -1)
          if [ "${LB_IP}" != "${CURRENT_DNS_IP}" ]; then
            echo "::warning::LB IP changed (${CURRENT_DNS_IP} -> ${LB_IP}) — DNS sync needed, see LEARNING-LOG §15 follow-up (D8)."
            # oci dns record rrset update ... (left as a follow-up: needs the
            # exact zone OCID + rrset shape confirmed once, then this becomes
            # a real command instead of a warning).
          fi

  ansible-configure:
    needs: [changes, approve, terraform-apply]
    if: >
      always() &&
      needs.approve.result == 'success' &&
      (needs.terraform-apply.result == 'success' || needs.terraform-apply.result == 'skipped') &&
      (needs.changes.outputs.terraform == 'true' || needs.changes.outputs.ansible == 'true' || needs.changes.outputs.workflows == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: k8s-lab-infra

      - uses: actions/checkout@v7
        with:
          repository: nskgit/k8s-lab-gitops
          ssh-key: ${{ secrets.ARGOCD_DEPLOY_SSH_PRIVATE_KEY }}
          path: k8s-lab-gitops

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned ansible toolchain + collections
        working-directory: k8s-lab-infra/ansible
        run: |
          pip install ansible-core==2.21.2
          ansible-galaxy collection install -r requirements.yml   # community.general is already in requirements.yml

      - name: Configure OCI CLI credentials
        run: |
          mkdir -p ~/.oci
          printf '%s' "${{ secrets.OCI_CONFIG_FILE_CONTENT }}" > ~/.oci/config
          printf '%s' "${{ secrets.OCI_PRIVATE_KEY_PEM }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/config ~/.oci/oci_api_key.pem

      - name: Write backend.hcl + init (read-only outputs from here on)
        working-directory: k8s-lab-infra/terraform/primary
        run: |
          cat > backend.hcl <<'EOF'
          bucket    = "k8s-lab-tfstate"
          namespace = "idqz7bbbe34a"
          key       = "primary/terraform.tfstate"
          region    = "us-ashburn-1"
          auth      = "APIKey"
          config_file_profile = "DEFAULT"
          EOF
          terraform init -backend-config=backend.hcl -input=false

      - name: Write the node SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/k8s_lab_ed25519
          chmod 600 ~/.ssh/k8s_lab_ed25519

      - name: Render CI inventory from Terraform outputs
        working-directory: k8s-lab-infra
        run: |
          chmod +x ansible/inventory/render-inventory.sh
          ./ansible/inventory/render-inventory.sh terraform/primary ~/.ssh/k8s_lab_ed25519 > /tmp/ci-inventory.ini

      - name: Run site.yml (config mgmt + argo-bootstrap)
        working-directory: k8s-lab-infra/ansible
        env:
          ARGOCD_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.ARGOCD_DEPLOY_SSH_PRIVATE_KEY }}
          TLS_WILDCARD_CERT_PEM: ${{ secrets.TLS_WILDCARD_CERT_PEM }}
          TLS_WILDCARD_KEY_PEM: ${{ secrets.TLS_WILDCARD_KEY_PEM }}
          TLS_PLDISTURBME_CERT_PEM: ${{ secrets.TLS_PLDISTURBME_CERT_PEM }}
          TLS_PLDISTURBME_KEY_PEM: ${{ secrets.TLS_PLDISTURBME_KEY_PEM }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          OCIR_PULL_TOKEN: ${{ secrets.OCIR_PULL_TOKEN }}
        run: |
          ansible-playbook site.yml -i /tmp/ci-inventory.ini \
            -e gitops_repo_path="${GITHUB_WORKSPACE}/k8s-lab-gitops"

  smoke-test:
    needs: ansible-configure
    # always() is load-bearing, not decoration: GitHub Actions propagates a
    # skip transitively through the whole job-ancestry graph, not just
    # direct `needs` — terraform-apply skipping (correctly, on a push with
    # no terraform/** changes) was enough to force smoke-test to skip too,
    # even though ansible-configure itself succeeded (confirmed live,
    # 2026-09-09: run 34357412627, ansible-configure success, smoke-test
    # skipped anyway). ansible-configure already guards against this one
    # step up; smoke-test never had the same guard.
    if: always() && needs.ansible-configure.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      # Consumed by rollback-on-failure to target exactly the apps that
      # were actually Degraded, instead of reverting the whole infra repo
      # for what might be an app-only problem. $GITHUB_OUTPUT is written
      # regardless of this step's own exit code, as long as the step ran
      # to that point — the later `exit 1` below doesn't drop it.
      degraded_apps: ${{ steps.health.outputs.degraded_apps }}
    steps:
      - uses: actions/checkout@v7

      - name: Public URLs return 2xx/3xx
        run: |
          for h in echo blog podinfo db-admin grafana hello-api; do
            code=$(curl -sk -m 10 -o /dev/null -w '%{http_code}' "https://${h}.satheshkumarnapoleon.site/")
            echo "${h}: ${code}"
            case "${code}" in 2??|3??) ;; *) echo "::error::${h} returned ${code}"; exit 1 ;; esac
          done

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure OCI CLI credentials + backend (to read bastion/cp IPs)
        working-directory: terraform/primary
        run: |
          mkdir -p ~/.oci
          printf '%s' "${{ secrets.OCI_CONFIG_FILE_CONTENT }}" > ~/.oci/config
          printf '%s' "${{ secrets.OCI_PRIVATE_KEY_PEM }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/config ~/.oci/oci_api_key.pem
          cat > backend.hcl <<'EOF'
          bucket    = "k8s-lab-tfstate"
          namespace = "idqz7bbbe34a"
          key       = "primary/terraform.tfstate"
          region    = "us-ashburn-1"
          auth      = "APIKey"
          config_file_profile = "DEFAULT"
          EOF
          terraform init -backend-config=backend.hcl -input=false

      - name: Nodes Ready + Argo Applications Healthy (via bastion tunnel)
        id: health
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/k8s_lab_ed25519
          chmod 600 ~/.ssh/k8s_lab_ed25519

          BASTION_IP=$(terraform -chdir=terraform/primary output -raw bastion_public_ip)
          CP_IP=$(terraform -chdir=terraform/primary output -raw control_plane_private_ip)

          # Bare `-J` (ProxyJump) does not reliably carry -i's identity
          # file to the jump hop against this bastion — confirmed live
          # (2026-09-09, first real smoke-test run: "Permission denied
          # (publickey...)" reaching the bastion itself, immediately
          # resolved by switching to this exact ProxyCommand form).
          # render-inventory.sh and ansible's ssh_common_args already use
          # this pattern for the same bastion; this step never had it.
          PROXY="ssh -i ~/.ssh/k8s_lab_ed25519 -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes -W %h:%p opc@${BASTION_IP}"

          ssh -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes -o ConnectTimeout=10 \
            -i ~/.ssh/k8s_lab_ed25519 -f -N -L 6443:127.0.0.1:6443 \
            -o ProxyCommand="${PROXY}" \
            "opc@${CP_IP}"
          sleep 3

          export KUBECONFIG=/tmp/ci-kubeconfig
          ssh -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes -i ~/.ssh/k8s_lab_ed25519 \
            -o ProxyCommand="${PROXY}" \
            "opc@${CP_IP}" \
            "sudo cat /etc/kubernetes/admin.conf" \
            | sed "s#server: https://.*:6443#server: https://127.0.0.1:6443#" \
            > "${KUBECONFIG}"

          echo "Waiting for all nodes Ready (timeout 300s)..."
          kubectl wait --for=condition=Ready nodes --all --timeout=300s

          echo "Waiting for all Argo Applications Synced+Healthy (timeout 600s)..."
          END=$((SECONDS + 600))
          while [ "${SECONDS}" -lt "${END}" ]; do
            NOT_READY=$(kubectl -n argocd get applications -o json \
              | jq -r '.items[] | select(.status.sync.status != "Synced" or .status.health.status != "Healthy") | .metadata.name')
            if [ -z "${NOT_READY}" ]; then
              echo "All Argo Applications Synced+Healthy."
              break
            fi
            echo "Still waiting on: ${NOT_READY}"
            sleep 15
          done
          if [ -n "${NOT_READY:-}" ]; then
            DEGRADED_JSON=$(jq -R -s -c 'split("\n") | map(select(length > 0))' <<<"${NOT_READY}")
            echo "degraded_apps=${DEGRADED_JSON}" >> "$GITHUB_OUTPUT"
            echo "::error::Timed out waiting on: ${NOT_READY}"
            kubectl -n argocd get applications
            exit 1
          fi

  rollback-on-failure:
    needs: [terraform-apply, ansible-configure, smoke-test]
    if: failure() && needs.terraform-apply.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Only for a genuine config-management failure — a smoke-test-only
      # failure (ansible-configure succeeded or was skipped) gets the
      # surgical per-app Argo rollback below instead. Reverting the whole
      # infra repo wouldn't even address an app-only problem, and the
      # commit that triggered this run may not be at fault for it.
      - name: Open a revert PR (terraform/ansible layer — never auto-merged)
        if: needs.ansible-configure.result == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="revert-$(git rev-parse --short HEAD)"
          git config user.name "infra-cd-bot"
          git config user.email "actions@github.com"
          git checkout -b "${BRANCH}"
          git revert --no-edit HEAD
          git push origin "${BRANCH}"
          gh pr create --title "Revert: CD pipeline failed on $(git rev-parse --short HEAD~1)" \
            --body "infra-cd.yml failed after this commit merged (terraform apply or ansible-configure — see the failed run for which). Opening this revert for human review rather than auto-merging, per the incident lessons in LEARNING-LOG §15: an unreviewed revert onto a possibly-partially-applied state can compound the problem. Merge this PR to roll forward with the revert." \
            --base main --head "${BRANCH}"

      - uses: hashicorp/setup-terraform@v4
        if: needs.ansible-configure.result != 'failure' && needs.smoke-test.result == 'failure'
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure OCI CLI credentials + backend (to read bastion/cp IPs)
        if: needs.ansible-configure.result != 'failure' && needs.smoke-test.result == 'failure'
        working-directory: terraform/primary
        run: |
          mkdir -p ~/.oci
          printf '%s' "${{ secrets.OCI_CONFIG_FILE_CONTENT }}" > ~/.oci/config
          printf '%s' "${{ secrets.OCI_PRIVATE_KEY_PEM }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/config ~/.oci/oci_api_key.pem
          cat > backend.hcl <<'EOF'
          bucket    = "k8s-lab-tfstate"
          namespace = "idqz7bbbe34a"
          key       = "primary/terraform.tfstate"
          region    = "us-ashburn-1"
          auth      = "APIKey"
          config_file_profile = "DEFAULT"
          EOF
          terraform init -backend-config=backend.hcl -input=false

      # Only reached when infra/ansible are otherwise healthy and
      # smoke-test alone found specific apps Degraded — see the plan
      # doc's rollback design ("far more surgical than reverting the
      # whole infra repo for an app-layer problem"). Rolls each degraded
      # app back to the history entry immediately before its current
      # sync, via the same Application.spec.operation field the real
      # `argocd app rollback` CLI patches internally — confirmed live
      # against this cluster's actual CRD schema (2026-09-10) rather
      # than assumed: single-source apps carry history[].revision +
      # .source, but multi-source apps (kube-prometheus-stack, Helm
      # chart + a values-repo ref) carry history[].revisions + .sources
      # (plural) instead, and the operation patch has to match whichever
      # shape the target app actually uses.
      - name: Argo app-layer rollback (only if apps went Degraded, infra/ansible otherwise fine)
        if: needs.ansible-configure.result != 'failure' && needs.smoke-test.result == 'failure'
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/k8s_lab_ed25519
          chmod 600 ~/.ssh/k8s_lab_ed25519

          BASTION_IP=$(terraform -chdir=terraform/primary output -raw bastion_public_ip)
          CP_IP=$(terraform -chdir=terraform/primary output -raw control_plane_private_ip)
          PROXY="ssh -i ~/.ssh/k8s_lab_ed25519 -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes -W %h:%p opc@${BASTION_IP}"

          ssh -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes -o ConnectTimeout=10 \
            -i ~/.ssh/k8s_lab_ed25519 -f -N -L 6443:127.0.0.1:6443 \
            -o ProxyCommand="${PROXY}" \
            "opc@${CP_IP}"
          sleep 3

          export KUBECONFIG=/tmp/ci-kubeconfig
          ssh -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes -i ~/.ssh/k8s_lab_ed25519 \
            -o ProxyCommand="${PROXY}" \
            "opc@${CP_IP}" \
            "sudo cat /etc/kubernetes/admin.conf" \
            | sed "s#server: https://.*:6443#server: https://127.0.0.1:6443#" \
            > "${KUBECONFIG}"

          DEGRADED='${{ needs.smoke-test.outputs.degraded_apps }}'
          if [ -z "${DEGRADED}" ] || [ "${DEGRADED}" = "[]" ]; then
            echo "smoke-test reported no structured degraded-app list (e.g. it timed out waiting on nodes, before the Argo check ran) — nothing this step can target."
            exit 1
          fi
          echo "Degraded apps to roll back: ${DEGRADED}"

          OVERALL_OK=true
          for APP in $(jq -r '.[]' <<<"${DEGRADED}"); do
            echo "::group::${APP}"
            HISTORY=$(kubectl -n argocd get application "${APP}" -o jsonpath='{.status.history}')
            LEN=$(jq 'length' <<<"${HISTORY}")
            if [ "${LEN}" -lt 2 ]; then
              echo "::warning::${APP} has fewer than 2 history entries (${LEN}) — nothing to roll back to. Skipping."
              OVERALL_OK=false
              echo "::endgroup::"
              continue
            fi

            TARGET=$(jq '.[-2]' <<<"${HISTORY}")
            if jq -e 'has("revisions")' <<<"${TARGET}" > /dev/null; then
              # Multi-source app: plural revisions/sources.
              PATCH=$(jq -n --argjson t "${TARGET}" \
                '{operation:{initiatedBy:{username:"infra-cd-bot"},info:[{name:"Reason",value:"smoke-test found this app Degraded; auto-rollback to its previous history entry"}],sync:{revisions:$t.revisions,sources:$t.sources,prune:true,syncStrategy:{apply:{force:true}}}}}')
            else
              PATCH=$(jq -n --argjson t "${TARGET}" \
                '{operation:{initiatedBy:{username:"infra-cd-bot"},info:[{name:"Reason",value:"smoke-test found this app Degraded; auto-rollback to its previous history entry"}],sync:{revision:$t.revision,source:$t.source,prune:true,syncStrategy:{apply:{force:true}}}}}')
            fi

            echo "Rolling back ${APP} to history id $(jq -r '.id' <<<"${TARGET}")..."
            kubectl -n argocd patch application "${APP}" --type merge -p "${PATCH}"

            echo "Waiting for the rollback operation to complete (timeout 180s)..."
            OP_END=$((SECONDS + 180))
            PHASE=""
            while [ "${SECONDS}" -lt "${OP_END}" ]; do
              PHASE=$(kubectl -n argocd get application "${APP}" -o jsonpath='{.status.operationState.phase}' 2>/dev/null || true)
              [ "${PHASE}" = "Succeeded" ] || [ "${PHASE}" = "Failed" ] || [ "${PHASE}" = "Error" ] && break
              sleep 10
            done
            echo "Operation phase: ${PHASE:-timed out}"

            echo "Waiting for ${APP} to report Healthy again (timeout 120s)..."
            HEALTH_END=$((SECONDS + 120))
            STATUS=""
            while [ "${SECONDS}" -lt "${HEALTH_END}" ]; do
              STATUS=$(kubectl -n argocd get application "${APP}" -o jsonpath='{.status.health.status}' 2>/dev/null || true)
              [ "${STATUS}" = "Healthy" ] && break
              sleep 10
            done

            if [ "${PHASE}" = "Succeeded" ] && [ "${STATUS}" = "Healthy" ]; then
              echo "${APP}: rollback succeeded, app is Healthy."
            else
              echo "::error::${APP}: rollback did not restore health (operation phase=${PHASE:-unknown}, health=${STATUS:-unknown}) — needs a human look."
              OVERALL_OK=false
            fi
            echo "::endgroup::"
          done

          [ "${OVERALL_OK}" = "true" ]
