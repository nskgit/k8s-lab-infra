# ============================================================================
# httpbin — second app behind the shared Gateway (Phase 6 expansion demo S1).
#
# The point: adding app #2 to the platform costs exactly this file.
#   - no Gateway change (allowedRoutes already permits demo)
#   - no LB / Terraform change (same NodePorts)
#   - no DNS change (the * A-record covers every subdomain)
#   - no cert change (the wildcard covers httpbin.satheshkumarnapoleon.site)
#
# go-httpbin is a request/response playground — useful endpoints:
#   /get /headers /ip     echo request details
#   /status/<code>        return any HTTP status (test error handling)
#   /delay/<sec>          slow response (test timeouts + alerts later)
#
#   kubectl apply -f gitops/workloads/demo/httpbin.yaml
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin
  namespace: demo
  labels:
    app: httpbin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpbin
  template:
    metadata:
      labels:
        app: httpbin
    spec:
      containers:
        - name: httpbin
          # go-httpbin: multi-arch (arm64 for our A1 nodes). The classic
          # kennethreitz/httpbin is amd64-only and would CrashLoop here.
          image: mccutchen/go-httpbin:2.23.1
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin
  namespace: demo
spec:
  selector:
    app: httpbin
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httpbin
  namespace: demo
spec:
  parentRefs:
    - name: lab-gateway
      namespace: istio-system
  hostnames:
    - httpbin.satheshkumarnapoleon.site
  rules:
    - backendRefs:
        - name: httpbin
          port: 80
