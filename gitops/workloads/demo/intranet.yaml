# ============================================================================
# intranet — demo app that attaches to the INTERNAL gateway only.
#
# The two-curl proof this enables:
#   internet → http://intranet.satheshkumarnapoleon.site/  → 404
#     (wildcard DNS resolves to the LB → PUBLIC Envoy → which has no route
#      for this host; the internal gateway is simply not reachable from
#      outside)
#   kubectl port-forward svc/istio-internal-gateway 8081:80 →
#   curl -H "Host: intranet.satheshkumarnapoleon.site" localhost:8081 → 200
#
#   kubectl apply -f gitops/workloads/demo/intranet.yaml
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: intranet
  namespace: demo
  labels:
    app: intranet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: intranet
  template:
    metadata:
      labels:
        app: intranet
    spec:
      containers:
        - name: echo
          image: mendhak/http-https-echo:37   # already cached on the nodes
          ports:
            - containerPort: 8080
          env:
            - name: HTTP_PORT
              value: "8080"
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: intranet
  namespace: demo
spec:
  selector:
    app: intranet
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: intranet
  namespace: demo
spec:
  parentRefs:
    - name: internal-gateway      # ← the second Gateway, NOT lab-gateway
      namespace: istio-system
  hostnames:
    - intranet.satheshkumarnapoleon.site
  rules:
    - backendRefs:
        - name: intranet
          port: 80
