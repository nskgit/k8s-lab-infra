# ============================================================================
# lab-gateway — the cluster's single north-south entry point (Gateway API).
#
# Applied manually in Phase 6; becomes an Argo-managed resource at Phase 8.
#   kubectl apply -f gitops/platform/istio/gateway.yaml
#
# The moment this lands, istiod pushes listener config over xDS to the
# istio-ingressgateway Envoy: :80/:443 open in-pod (no restart), the OCI LB
# health checks flip to OK, and curls change from 502 (no healthy backends)
# to 404 (Envoy: "no route matches"). HTTPRoutes then turn 404 into 200.
# ============================================================================
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: lab-gateway
  namespace: istio-system
spec:
  gatewayClassName: istio          # registered by the istiod chart

  # ── Manual deployment mode (2nd-LB trap defused) ──────────────────────
  # Without spec.addresses, Istio auto-deploys a fresh Envoy Deployment +
  # Service (type LoadBalancer!) per Gateway — our live CCM would mint a
  # second billed OCI LB for each. Pointing addresses at the EXISTING
  # istio-ingressgateway Service means: program that Envoy, deploy nothing.
  addresses:
    - type: Hostname
      value: istio-ingressgateway.istio-system.svc.cluster.local

  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All              # lab: any namespace may attach HTTPRoutes.
                                 # prod: Same or a label Selector — this is
                                 # the multi-team security boundary.

    # Two HTTPS listeners on the SAME port — SNI picks the listener (and
    # therefore the cert) from the hostname the client sends in the TLS
    # handshake. One IP, one port, N domains. The listener hostname is
    # also a route-admission boundary: routes can only bind where their
    # hostnames intersect.
    - name: https-sathesh
      port: 443
      protocol: HTTPS
      hostname: "*.satheshkumarnapoleon.site"
      tls:
        mode: Terminate          # Envoy decrypts here (the LB is L4 passthrough)
        certificateRefs:
          - name: istio-ingressgateway-tls-wildcard   # Secret from P6-3
      allowedRoutes:
        namespaces:
          from: All

    - name: https-pldisturbme    # domain #2 (added 2026-07-12; DNS pending —
      port: 443                  # test with curl --resolve until the * A-record
      protocol: HTTPS            # lands at the registrar)
      hostname: "*.pldisturbme.site"
      tls:
        mode: Terminate
        certificateRefs:
          - name: istio-ingressgateway-tls-pldisturbme
      allowedRoutes:
        namespaces:
          from: All
