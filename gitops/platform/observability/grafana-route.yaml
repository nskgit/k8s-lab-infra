# ============================================================================
# Grafana HTTPRoute — Phase 6 expansion S2: expose the EXISTING Grafana
# through the shared Gateway. No new Deployment; the route is the whole cost.
#
# Lives in monitoring/ (with the app it exposes — ownership model), attaches
# cross-namespace to lab-gateway in istio-system.
#
# Note: monitoring is NOT istio-injected and doesn't need to be — the
# gateway Envoy routes to any Service endpoints, meshed or not. The
# gateway→Grafana hop is plain HTTP (no mTLS); backends join the mesh for
# its features, not as a requirement to receive ingress traffic.
#
# LAB COMPROMISE (named in kps-values.yaml too): admin UI on the public
# gateway behind Grafana's own login. Production = internal gateway on a
# private LB + SSO (see the multi-gateway topology discussion).
#
#   kubectl apply -f gitops/platform/observability/grafana-route.yaml
# ============================================================================
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: lab-gateway
      namespace: istio-system
  hostnames:
    - grafana.satheshkumarnapoleon.site
  rules:
    - backendRefs:
        - name: kps-grafana
          port: 80
