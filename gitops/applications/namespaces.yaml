# ============================================================================
# Argo Application — namespaces (sync-wave -1: before everything).
#
# Fixes the rebuild hole found in the 2026-07-15 restructure review:
# every app uses CreateNamespace=false but no Namespace existed in git —
# a fresh rebuild would fail at wave 0 (istio-base needs istio-system).
#
# Each Namespace manifest carries Prune=false, so even with the fleet
# prune policy this app can never delete a namespace.
#
# Adopted 2026-07-15: first sync verified annotations-only, resources
# 'configured' (zero restarts); automated+selfHeal+prune since same day.
# ============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: namespaces
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:nskgit/k8s-lab-infra.git
    targetRevision: main
    path: gitops/platform/namespaces
  destination:
    server: https://kubernetes.default.svc
    namespace: default          # Namespaces are cluster-scoped; this is unused
  syncPolicy:
    # Fleet policy (flipped 2026-07-15 after verified adoption sync):
    # (each Namespace resource carries Prune=false — never prunable)
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
