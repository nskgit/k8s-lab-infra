# ============================================================================
# Argo Application — istio-internal-gateway (INTERNAL Envoy; NodePort
# 31080, deliberately wired to NO LB — exposure isolation by construction).
# SYNC-WAVE 2: needs istiod.
# ============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-internal-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://istio-release.storage.googleapis.com/charts
      chart: gateway
      targetRevision: 1.30.2
      helm:
        releaseName: istio-internal-gateway
        valueFiles:
          - $values/gitops/platform/istio/istio-internal-gateway-values.yaml
    - repoURL: git@github.com:nskgit/k8s-lab-infra.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    # Auto-sync (P8-29): git change deploys itself; live drift reverts in
    # seconds (selfHeal); resource removed from git is deleted (prune).
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=false
