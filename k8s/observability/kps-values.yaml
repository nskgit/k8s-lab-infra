# ============================================================================
# kube-prometheus-stack values — lab-sized for 2-worker A1.Flex cluster.
#
# Chart repo:  https://prometheus-community.github.io/helm-charts
# Chart:       kube-prometheus-stack
# Pin version at install time (helm upgrade --install --version <pin>).
#
# Phase 8 Argo adoption points its Application at THIS file. Zero rewrite.
# ----------------------------------------------------------------------------
# STORAGE NOTE
#   Prometheus PVC binds to `local-path` (cluster-default SC). Data lives on
#   whichever worker Prometheus scheduled onto — node death = history lost.
#   Acceptable: metrics are re-scraped continuously and 5d retention isn't
#   precious.
#
#   To swap to real network storage: set `storageClassName: oci-bv` below.
#   Consequence: CSI provisions a 50 GB Block Volume (~$1.28/mo), attach
#   moves with the pod on reschedule, history survives node loss. If we
#   wanted long retention + HA queryable metrics, prod pattern is
#   Prometheus + Thanos sidecar shipping blocks to Object Storage.
# ----------------------------------------------------------------------------
# COMPONENTS DELIBERATELY OFF
#   kubeEtcd (:2381) — would need +1 NSG rule cp→cp for etcd metrics.
#   kubeProxy (:10249) — small value in lab; would need +1 NSG rule.
#   Flip either on: `kubeEtcd.enabled: true` + NSG rule in TF network module.
# ============================================================================

fullnameOverride: kps

# ─── Prometheus operator itself (the CRD reconciler) ─────────────────────────
prometheusOperator:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { cpu: 200m, memory: 256Mi }
  admissionWebhooks:
    # Cert rotation via jobs (default). No cert-manager dependency.
    patch:
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits:   { cpu: 100m, memory: 64Mi }

# ─── Prometheus (the TSDB + scrape engine) ───────────────────────────────────
prometheus:
  prometheusSpec:
    # 5 days retention; TSDB size limit as safety net
    retention: 5d
    retentionSize: 6GiB
    scrapeInterval: 60s
    evaluationInterval: 60s

    resources:
      requests: { cpu: 250m, memory: 750Mi }
      # Memory limit only. CPU unlimited on purpose — scrapes are bursty
      # and CPU is compressible; a limit here just causes throttle spikes
      # during the every-60s scrape wave without protecting anything.
      # (K8s schema: "no CPU limit" means the field is absent, not null.)
      limits:   { memory: 1500Mi }

    replicas: 1

    # ServiceMonitor/PodMonitor discovery — empty selector = watch ALL
    # namespaces. Needed later for Istio's own SM/PM to be picked up.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false

    # PVC on local-path (see STORAGE NOTE at top)
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 8Gi

# ─── Alertmanager (alert routing + dedup + silences) ─────────────────────────
alertmanager:
  alertmanagerSpec:
    replicas: 1
    resources:
      requests: { cpu: 25m, memory: 64Mi }
      limits:   { cpu: 100m, memory: 128Mi }

    # 1Gi PVC so silences survive restart (default keeps them in-memory)
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 1Gi

  # Routing tree: null receiver for Phase 7. Wired to Slack in P7-5 as its own
  # reviewable diff so the routing design is easy to inspect.
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'null-receiver'
      routes:
        - matchers: [alertname="Watchdog"]
          receiver: 'null-receiver'
    receivers:
      - name: 'null-receiver'
    inhibit_rules:
      - source_matchers: [severity="critical"]
        target_matchers: [severity="warning"]
        equal: ['alertname', 'namespace']

# ─── Grafana (dashboards + query UI) ─────────────────────────────────────────
grafana:
  # Public URL (Phase 6 S2: exposed via HTTPRoute on the shared Gateway).
  # Grafana builds login/OAuth redirects from root_url — behind a proxy
  # without it, logins bounce to the wrong host.
  # LAB COMPROMISE (named): admin UI on the PUBLIC gateway, protected only
  # by Grafana's login. Production = internal gateway on a private LB + SSO.
  grafana.ini:
    server:
      root_url: https://grafana.satheshkumarnapoleon.site

  # No PVC — dashboards are ConfigMap-provisioned so a rebuild is clean
  persistence:
    enabled: false

  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { cpu: 200m, memory: 256Mi }

  # Sidecar auto-loads any ConfigMap in any namespace labeled:
  #   grafana_dashboard: "1"  (JSON dashboards)
  #   grafana_datasource: "1" (Loki, etc. — used in Phase 7b)
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
      label: grafana_dashboard
    datasources:
      enabled: true
      searchNamespace: ALL
      label: grafana_datasource

  # Admin credentials come from a pre-created Secret (grafana-admin) so the
  # value isn't in helm release history or values.yaml. Rendered separately
  # by the install script.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  # Provisioned datasources: Prometheus wired in by the chart automatically.
  # Loki datasource added in Phase 7b via a labeled ConfigMap.

# ─── kube-state-metrics (deployment/pod/statefulset counts + status) ─────────
kube-state-metrics:
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits:   { cpu: 100m, memory: 128Mi }

# ─── node-exporter (per-node CPU/mem/disk/net from /proc, /sys) ──────────────
prometheus-node-exporter:
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits:   { cpu: 100m, memory: 64Mi }
  # Tolerate cp taint so we scrape cp too (cluster-wide metrics coverage).
  tolerations:
    - operator: Exists
      effect: NoSchedule

# ─── Component scrape targets ────────────────────────────────────────────────
# ON: kubelet, apiserver, coredns, KCM, scheduler (paired with bind-address
#     Phase 7 pre-work), + node-exporter + kube-state-metrics (above)
# OFF: kubeEtcd, kubeProxy (see rationale in header)

kubelet:
  enabled: true
  serviceMonitor:
    # Scrapes both cAdvisor + kubelet /metrics on every node via kubelet:10250
    interval: 60s

kubeApiServer:
  enabled: true

coreDns:
  enabled: true

kubeControllerManager:
  enabled: true
  # Force endpoint discovery to cp's real IP (KCM runs hostNetwork, so its
  # "pod IP" IS the node IP). Without this the chart tries a default svc
  # selector that doesn't exist for kubeadm-installed KCM.
  endpoints:
    - 10.0.1.209
  service:
    enabled: true
    port: 10257
    targetPort: 10257
  serviceMonitor:
    https: true
    # Skip cert verify — cp uses kubeadm's self-signed certs for :10257.
    # Prod: bind-address to specific IP + proper cert. Lab: acceptable
    # because ports are RBAC-authed + NSG-scoped to workers.
    insecureSkipVerify: true

kubeScheduler:
  enabled: true
  endpoints:
    - 10.0.1.209
  service:
    enabled: true
    port: 10259
    targetPort: 10259
  serviceMonitor:
    https: true
    insecureSkipVerify: true

kubeEtcd:
  enabled: false      # see header rationale

kubeProxy:
  enabled: false      # see header rationale

# ─── Default rules (~60 alerts, chart-shipped) ───────────────────────────────
defaultRules:
  create: true
  rules:
    # Turn OFF alerts for scrape targets we disabled — otherwise these fire
    # constantly as "no data"
    etcd: false
    kubeProxy: false
    # Keep the always-firing Watchdog canary — proves AM plumbing is live
