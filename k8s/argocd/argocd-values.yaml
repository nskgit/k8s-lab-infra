# ============================================================================
# Argo CD — GitOps controller. Trimmed for the lab: no dex (SSO), no
# notifications, no applicationSet (the root-app pattern uses a plain
# Application), single replicas. Access via port-forward over the SSH
# tunnel — no ingress/LB.
#
# Chart:   argo/argo-cd  (pin at install)
# NS:      argocd
# ~600Mi total across server/controller/repo-server/redis.
# ============================================================================

global:
  # Lab: keep everything single-replica.
  revisionHistoryLimit: 3

dex:
  enabled: false           # no SSO in the lab (admin password only)
notifications:
  enabled: false
applicationSet:
  enabled: false           # root-app is a plain Application, not a Set

configs:
  cm:
    # THE pre-adoption must-do: annotation-based resource tracking.
    # Default label tracking (argocd.argoproj.io/instance label) COLLIDES
    # with Helm-chart-set app.kubernetes.io/instance labels that live
    # inside IMMUTABLE selectors (Deployments/StatefulSets) — adoption
    # would fail on "field is immutable". Annotation tracking sidesteps it.
    application.resourceTrackingMethod: annotation

    # Argo 3.x default exclusions MINUS core v1/Endpoints. Why: kps
    # hand-crafts two selectorless-Service Endpoints (kube-controller-
    # manager + kube-scheduler scrape targets on the cp IP). With the
    # default exclusion Argo won't manage them → a from-scratch rebuild
    # would silently skip creating them → KCM/scheduler scrapes born
    # broken. Trade-off accepted: Argo now watches all v1 Endpoints
    # (negligible churn at our ~30-Service scale). EndpointSlice + every
    # other default exclusion (Leases, auth reviews, CSRs, Cilium,
    # Kyverno) kept verbatim from the shipped default.
    resource.exclusions: |
      - apiGroups:
        - discovery.k8s.io
        kinds:
        - EndpointSlice
      - apiGroups:
        - coordination.k8s.io
        kinds:
        - Lease
      - apiGroups:
        - authentication.k8s.io
        - authorization.k8s.io
        kinds:
        - SelfSubjectReview
        - TokenReview
        - LocalSubjectAccessReview
        - SelfSubjectAccessReview
        - SelfSubjectRulesReview
        - SubjectAccessReview
      - apiGroups:
        - certificates.k8s.io
        kinds:
        - CertificateSigningRequest
      - apiGroups:
        - cert-manager.io
        kinds:
        - CertificateRequest
      - apiGroups:
        - cilium.io
        kinds:
        - CiliumIdentity
        - CiliumEndpoint
        - CiliumEndpointSlice
      - apiGroups:
        - kyverno.io
        - reports.kyverno.io
        - wgpolicyk8s.io
        kinds:
        - PolicyReport
        - ClusterPolicyReport
        - EphemeralReport
        - ClusterEphemeralReport
        - AdmissionReport
        - ClusterAdmissionReport
        - BackgroundScanReport
        - ClusterBackgroundScanReport
        - UpdateRequest
  params:
    # Port-forward over the SSH tunnel → skip server-side TLS (no cert
    # juggling for an internal-only UI). We reach it via localhost.
    server.insecure: "true"

server:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { memory: 256Mi }

controller:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    # 512Mi OOMKilled the controller 13x the moment kube-prometheus-stack
    # (116 resources, multi-MB CRDs, ~14MB comparison state) was added —
    # syncs wedged at 0 tasks while the controller crash-looped. Controller
    # memory scales with the LARGEST app; kps is the classic breaker.
    limits:   { memory: 1Gi }

repoServer:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { memory: 512Mi }   # headroom for rendering the kps chart

redis:
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits:   { memory: 128Mi }
