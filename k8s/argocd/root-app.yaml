# ============================================================================
# platform-root — the app-of-apps. Its "resources" are the Application
# objects in k8s/argocd/apps/: one Argo app that manages all the others.
#
# Rebuild story: Ansible installs Argo → kubectl apply THIS ONE FILE →
# the whole platform cascades (children created here, each child then
# syncs its component in sync-wave order: base 0 → istiod 1 → gateways 2).
#
# Membership = the directory listing. Add a component: commit a new
# Application yaml into k8s/argocd/apps/. (Pruning on child removal is
# deliberately OFF for now — enable automated+prune later, after the
# auto-sync decision.)
#
#   kubectl apply -f k8s/argocd/root-app.yaml     (the last manual apply)
# ============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:nskgit/k8s-lab-infra.git
    targetRevision: main
    path: k8s/argocd/apps
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd            # child Application objects live in argocd ns
  syncPolicy:
    # Auto-sync (P8-29): new/changed child Application yamls in
    # k8s/argocd/apps/ apply themselves. PRUNE OFF deliberately: children
    # carry resources-finalizers, so pruning a child Application would
    # CASCADE-DELETE its entire component — removing a platform component
    # stays a deliberate manual act (delete yaml + manual prune-sync).
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
