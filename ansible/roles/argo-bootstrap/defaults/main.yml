---
# Path to the k8s-lab-gitops checkout, relative to this repo's own layout.
# Locally: ~/workspace/k8s-lab-infra/ansible/../../k8s-lab-gitops resolves
# to ~/workspace/k8s-lab-gitops (the two repos are checked out as siblings).
# In CD, the workflow checks out k8s-lab-gitops into that exact same
# sibling position so this default never needs overriding.
gitops_repo_path: "{{ playbook_dir }}/../../k8s-lab-gitops"

# helm CLI itself (not the argo-cd chart below) — pinned to the latest v3.x
# patch release as of 2026-09-09. Helm v4 is the current upstream stable
# line, but this role's whole command set (--disable-openapi-validation,
# etc.) and the live in-cluster Argo CD release were built/proven against
# v3 — staying on v3 here is deliberate; v4 migration is a separate,
# later decision, not bundled into this fix. v3 gets security fixes into
# 2027, so there's no urgency.
helm_version: "v3.21.3"

# MUST match what `helm list -n argocd` shows on the live cluster. The role
# does `helm upgrade --install --version <this>`, so a stale pin here isn't
# harmless — it's an unreviewed upgrade *or downgrade* of the whole GitOps
# control plane on the next CD run. The `assert` task above this comment's
# sibling in tasks/main.yml now refuses a downgrade structurally; a bump is
# still a deliberate, reviewed change.
#
# 10.8.2 -> 10.8.4 (2026-09-10): real test case for the new --atomic +
# post-upgrade-verify rollback path added in this same change. Diffed the
# two chart versions before bumping (`helm pull --version X --untar`) —
# the only difference is a redis_exporter image tag bump (v1.91.0 ->
# v1.91.1); same appVersion (v3.5.2), zero values.yaml schema changes.
# Deliberately picked a minimal, low-risk real bump to exercise the
# mechanism end-to-end rather than a synthetic one.
argocd_helm_version: "10.8.4"

# Non-secret identity — the OCIR pull token itself is read from the
# OCIR_PULL_TOKEN environment variable (never a var default, never logged).
ocir_pull_server: "iad.ocir.io"
ocir_pull_username: "idqz7bbbe34a/pldisturbme@gmail.com"

grafana_admin_user: "admin"
