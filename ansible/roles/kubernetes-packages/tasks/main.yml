---
# kubernetes-packages — kubelet, kubeadm, kubectl installed and pinned.
# SELinux permissive (kubeadm preflight requirement), versionlock to
# prevent an accidental `dnf upgrade` jumping k8s minor.

# ── SELinux permissive (kubeadm preflight requirement) ────────────────────
- name: Set SELinux to permissive (running + persistent)
  ansible.posix.selinux:
    policy: targeted
    state: permissive

# ── Upstream pkgs.k8s.io repo ({{ kubernetes_repo_minor }} channel) ───────
# Matches the upstream-recommended pattern from https://kubernetes.io/docs/setup/
# — the `exclude=` line + `disable_excludes: kubernetes` on the install task
# gives us belt-and-suspenders pinning: dnf refuses these packages by default,
# and any stray `dnf install kubelet` from a script silently no-ops.
- name: Add pkgs.k8s.io repo ({{ kubernetes_repo_minor }})
  ansible.builtin.yum_repository:
    name: kubernetes
    description: "Kubernetes"
    baseurl: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_repo_minor }}/rpm/"
    gpgcheck: true
    gpgkey: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_repo_minor }}/rpm/repodata/repomd.xml.key"
    enabled: true
    exclude: "kubelet kubeadm kubectl cri-tools kubernetes-cni"

# ── versionlock plugin (install BEFORE the k8s packages) ──────────────────
- name: Install dnf versionlock plugin
  ansible.builtin.dnf:
    name: python3-dnf-plugin-versionlock
    state: present

# ── Install pinned kubelet, kubeadm, kubectl ──────────────────────────────
- name: Install kubelet/kubeadm/kubectl (pinned to {{ kubernetes_version }})
  ansible.builtin.dnf:
    name:
      - "kubelet-{{ kubernetes_version }}-*"
      - "kubeadm-{{ kubernetes_version }}-*"
      - "kubectl-{{ kubernetes_version }}-*"
    state: present
    allow_downgrade: true
    disable_excludes: kubernetes

# ── Lock so `dnf upgrade` can't jump k8s minor ────────────────────────────
# Skipped in --check: the versionlock plugin (installed above) doesn't
# actually get installed in check mode, so this module would fail with
# "plugin versionlock is required". On real apply the plugin lands first
# and this runs normally.
- name: Lock kubelet/kubeadm/kubectl versions
  community.general.dnf_versionlock:
    name:
      - kubelet
      - kubeadm
      - kubectl
    state: present
  when: not ansible_check_mode

# ── Service: enable at boot; leave running state alone. ──────────────────
#    kubeadm init/join starts kubelet with the right config; starting it
#    early races an empty config. On live cluster this is a no-op.
- name: Enable kubelet
  ansible.builtin.systemd:
    name: kubelet
    enabled: true
