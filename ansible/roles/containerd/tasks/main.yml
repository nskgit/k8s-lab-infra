---
# containerd — container runtime kubelet talks to. Installs the Docker CE
# canonical containerd.io package (upstream OS repos ship stale versions),
# generates default config, flips SystemdCgroup=true (must match kubelet
# cgroupDriver: systemd — mismatch = pods land in wrong cgroup hierarchy
# and memory limits silently don't apply).

# ── Docker CE repo (source of containerd.io) ───────────────────────────────
# Fetch Docker's official docker-ce.repo — identical to what
# `dnf config-manager --add-repo` produces. Multi-section file (stable,
# test, nightly + sources); only stable is enabled by default.
# Stat-guard (house pattern): get_url without a checksum can't verify
# remote-vs-local in --check mode and reports a phantom "changed"
# (ansible-core version-dependent). Fetch only when the file is absent.
- name: Check for Docker CE yum repo file
  ansible.builtin.stat:
    path: /etc/yum.repos.d/docker-ce.repo
  register: containerd_repo_file

- name: Add Docker CE yum repo
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/centos/docker-ce.repo
    dest: /etc/yum.repos.d/docker-ce.repo
    owner: root
    group: root
    mode: '0644'
  when: not containerd_repo_file.stat.exists

# ── Install pinned containerd.io ───────────────────────────────────────────
- name: Install containerd.io (pinned to {{ containerd_version }})
  ansible.builtin.dnf:
    name: "containerd.io-{{ containerd_version }}*"
    state: present
    allow_downgrade: true

# ── Config: SystemdCgroup=true (matches kubelet cgroupDriver: systemd) ────
- name: Ensure /etc/containerd directory exists
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Render default containerd config (deterministic per version)
  ansible.builtin.command: containerd config default
  register: containerd_default
  changed_when: false
  check_mode: false

- name: Write /etc/containerd/config.toml with SystemdCgroup=true
  ansible.builtin.copy:
    dest: /etc/containerd/config.toml
    content: "{{ containerd_default.stdout | regex_replace('SystemdCgroup = false', 'SystemdCgroup = true') }}\n"
    owner: root
    group: root
    mode: '0644'
  notify: Restart containerd

# ── Service ────────────────────────────────────────────────────────────────
- name: Enable + start containerd
  ansible.builtin.systemd:
    name: containerd
    state: started
    enabled: true
    daemon_reload: true
