# Phase 5a: static inventory pinned to the currently-running named instances.
# Phase 5b will switch to oracle.oci dynamic inventory once workers move to
# an instance pool. Bastion (157.151.226.90) is the jump host for the k8s
# nodes AND, since the 2026-09-09 wedge (see roles/bastion), a managed host
# in its own right: the "Bastion hardening" play in site.yml targets it
# directly, no proxy.
#
# Regenerate from Terraform outputs any time IPs drift:
#   ./inventory/render-inventory.sh    (added in a later block)

[bastion]
bastion-1 ansible_host=157.151.226.90

[bastion:vars]
ansible_user=opc
ansible_ssh_private_key_file=~/.ssh/k8s_lab_ed25519
ansible_ssh_common_args=-o StrictHostKeyChecking=accept-new

[control_plane]
control-plane-1 ansible_host=10.0.1.209

[workers]
worker-1 ansible_host=10.0.2.230
worker-2 ansible_host=10.0.2.100

[k8s_nodes:children]
control_plane
workers

[k8s_nodes:vars]
ansible_user=opc
ansible_ssh_private_key_file=~/.ssh/k8s_lab_ed25519
ansible_ssh_common_args=-o StrictHostKeyChecking=accept-new -o ProxyCommand="ssh -i ~/.ssh/k8s_lab_ed25519 -o StrictHostKeyChecking=accept-new -W %h:%p opc@157.151.226.90"
